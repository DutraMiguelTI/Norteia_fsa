<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">

  <!-- nuvens -->
  <ellipse cx="60" cy="50" rx="30" ry="14" fill="#e8f5ef"/>
  <ellipse cx="350" cy="35" rx="26" ry="12" fill="#e8f5ef"/>

  <!-- chão / grama -->
  <path d="M0 280 Q 200 250 400 280 L 400 320 L 0 320 Z" fill="#d9f0e2"/>
  <path d="M0 290 Q 200 265 400 290 L 400 320 L 0 320 Z" fill="#c3e8d1"/>

  <!-- arbustos -->
  <circle cx="55" cy="270" r="26" fill="#1e9c6e" opacity="0.85"/>
  <circle cx="90" cy="278" r="18" fill="#1e9c6e" opacity="0.7"/>
  <circle cx="345" cy="272" r="24" fill="#1e9c6e" opacity="0.85"/>
  <circle cx="315" cy="280" r="16" fill="#1e9c6e" opacity="0.7"/>

  <!-- caminho -->
  <path d="M170 320 C 190 260 210 240 230 210" stroke="#c3e8d1" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- poste da placa -->
  <rect x="262" y="90" width="10" height="180" rx="4" fill="#4b5563"/>

  <!-- placas apontando (setas coloridas) -->
  <g>
    <path d="M266 95 h70 l14 14 -14 14 h-70 z" fill="#1e9c6e"/>
    <circle cx="285" cy="109" r="6" fill="#ffffff" opacity="0.9"/>
  </g>
  <g>
    <path d="M266 128 h55 l14 14 -14 14 h-55 z" fill="#3b82f6"/>
    <rect x="278" y="136" width="12" height="12" rx="2" fill="#ffffff" opacity="0.9"/>
  </g>
  <g>
    <path d="M266 161 h62 l14 14 -14 14 h-62 z" fill="#ec4899"/>
    <path d="M282 175 l4 4 6 -8" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
  <g>
    <path d="M266 194 h48 l14 14 -14 14 h-48 z" fill="#f97316"/>
    <circle cx="280" cy="208" r="5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- pessoa, vista de costas, olhando para a placa -->
  <g>
    <!-- pernas -->
    <rect x="182" y="235" width="12" height="45" rx="5" fill="#1a2233"/>
    <rect x="200" y="235" width="12" height="45" rx="5" fill="#1a2233"/>
    <!-- corpo / moletom com capuz -->
    <path d="M168 165 q 30 -22 60 0 l 6 75 q -36 16 -72 0 z" fill="#1e9c6e"/>
    <!-- capuz -->
    <path d="M178 168 q 20 -14 40 0 l -4 14 q -16 -8 -32 0 z" fill="#17805c"/>
    <!-- cabeça -->
    <circle cx="198" cy="150" r="20" fill="#2d2a26"/>
    <!-- braço levantado, mão no queixo (gesto pensativo) -->
    <path d="M220 175 q 18 2 22 -18" stroke="#1e9c6e" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="244" cy="153" r="7" fill="#e8b18f"/>
  </g>

</svg>
