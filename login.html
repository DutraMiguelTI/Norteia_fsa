<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Norteia</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <!-- LADO DA ILUSTRAÇÃO -->
        <section class="login-illustration">

            <img
                src="images/imagem_login.png"
                alt="Jovem pensando sobre seu futuro profissional"
            >

        </section>


        <!-- LADO DO LOGIN -->
        <section class="login-area">

            <div class="login-card">

                <!-- Logo -->
                <div class="login-logo">
                    <span>🧭</span>
                    <strong>Norteia</strong>
                </div>


                <h1>Bem-vindo de volta!</h1>

                <p class="login-subtitle">
                    Entre na sua conta para continuar.
                </p>


                <form>

                    <!-- E-mail -->
                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>


                    <!-- Senha -->
                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>


                    <!-- Esqueci minha senha -->
                    <div class="forgot-password">

                        <a href="#">
                            Esqueci minha senha
                        </a>

                    </div>


                    <!-- Botão -->
                    <button type="submit">
                        Entrar
                    </button>

                </form>


                <!-- Cadastro -->
                <div class="register">

                    <span>
                        Ainda não tem uma conta?
                    </span>

                    <a href="#">
                        Cadastre-se
                    </a>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
