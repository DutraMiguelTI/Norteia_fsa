<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Norteia</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <!-- ==============================
             LADO DA ILUSTRAÇÃO
             ============================== -->

        <section class="login-illustration">

            <img
                src="images/imagem_login.webp"
                alt="Jovem pensando sobre seu futuro profissional"
            >

        </section>


        <!-- ==============================
             LADO DO LOGIN
             ============================== -->

        <section class="login-area">

            <div class="login-card">

                <!-- Logo -->
                <div class="login-logo">

                    <span>🧭</span>

                    <strong>Norteia</strong>

                </div>


                <!-- Título -->
                <h1>Bem-vindo!</h1>

                <p class="login-subtitle">
                    Entre na sua conta para continuar.
                </p>


                <!-- ==============================
                     FORMULÁRIO DE LOGIN
                     ============================== -->

                <form id="login-form" novalidate>

                    <!-- E-mail -->
                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">✉</span>

                            <input
                                type="email"
                                id="email"
                                placeholder="Digite seu e-mail"
                                required
                            >

                        </div>

                        <!-- Mensagem de erro do e-mail -->
                        <p
                            id="erro-email"
                            class="mensagem-erro"
                        ></p>

                    </div>


                    <!-- Senha -->
                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">🔒</span>

                            <input
                                type="password"
                                id="senha"
                                placeholder="Digite sua senha"
                                required
                            >

                        </div>

                        <!-- Mensagem de erro da senha -->
                        <p
                            id="erro-senha"
                            class="mensagem-erro"
                        ></p>

                    </div>


                    <!-- Esqueci minha senha -->
                    <div class="forgot-password">

                        <a href="#">
                            Esqueci minha senha
                        </a>

                    </div>


                    <!-- Botão -->
                    <button type="submit">
                        Entrar
                    </button>

                </form>


                <!-- ==============================
                     CADASTRO
                     ============================== -->

                <div class="register">

                    <span>
                        Ainda não tem uma conta?
                    </span>

                    <a href="cadastro.html">
                        Cadastre-se
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- ==============================
         SCRIPTS DO SUPABASE
         ============================== -->

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Conexão com o Supabase -->
    <script src="js/supabase.js"></script>

    <!-- Sistema de login -->
    <script src="js/login.js"></script>

</body>

</html>
