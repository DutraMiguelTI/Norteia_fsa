<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Norteia</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <!-- ==============================
             LADO DA ILUSTRAÇÃO
             ============================== -->

        <section class="login-illustration">

            <img
                src="images/imagem_login.webp"
                alt="Jovem pensando sobre seu futuro profissional"
            >

        </section>


        <!-- ==============================
             LADO DO CADASTRO
             ============================== -->

        <section class="login-area">

            <div class="login-card">

                <!-- Logo -->
                <div class="login-logo">

                    <span>🧭</span>

                    <strong>Norteia</strong>

                </div>


                <!-- Título -->
                <h1>Crie sua conta!</h1>

                <p class="login-subtitle">
                    Comece a descobrir seu caminho profissional.
                </p>


                <!-- ==============================
                     FORMULÁRIO
                     ============================== -->

                <form id="cadastro-form">

                    <!-- Nome -->
                    <div class="form-group">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                            required
                        >

                    </div>


                    <!-- E-mail -->
                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>


                    <!-- Senha -->
                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>


                    <!-- Confirmar senha -->
                    <div class="form-group">

                        <label for="confirmar-senha">
                            Confirmar senha
                        </label>

                        <input
                            type="password"
                            id="confirmar-senha"
                            placeholder="Digite sua senha novamente"
                            required
                        >

                    </div>


                    <!-- Botão -->
                    <button type="submit">
                        Criar conta
                    </button>

                </form>


                <!-- ==============================
                     MENSAGEM
                     ============================== -->

                <p
                    id="mensagem"
                    style="
                        text-align: center;
                        margin-top: 15px;
                        font-size: 14px;
                    "
                ></p>


                <!-- ==============================
                     LOGIN
                     ============================== -->

                <div class="register">

                    <span>
                        Já tem uma conta?
                    </span>

                    <a href="login.html">
                        Entrar
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- ==============================
         SCRIPTS DO SUPABASE
         ============================== -->

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Conexão com o Supabase -->
    <script src="js/supabase.js"></script>

    <!-- Sistema de cadastro -->
    <script src="js/cadastro.js"></script>

</body>

</html>
